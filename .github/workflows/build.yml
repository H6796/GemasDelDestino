name: Compilar mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -o '*.zip'
      - run: |
          DIR=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/salida"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/salida/"
      - uses: actions/upload-artifact@v4
        with:
          name: GemasDelDestino-jar
          path: salida/*.jar
